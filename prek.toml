#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-added-large-files" },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext", "md"] },
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.5.13"
hooks = [{ id = "biome-check" }]

[[repos]]
repo = "local"
hooks = [
    { id = "biome-html-format", name = "biome format HTML", entry = "npx --yes @biomejs/biome@2.5.13 format --write --files-ignore-unknown=true --no-errors-on-unmatched", language = "system", files = "\\.html$" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.26.0"
hooks = [
    { id = "commitlint", stages = ["commit-msg"], additional_dependencies = ["@commitlint/config-conventional"] },
]
