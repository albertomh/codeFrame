<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >
        <meta name="description" content="A tiny 3D code snippet showcase.">
        <title>codeShowcase</title>
        <style>
        :root {
            color-scheme: dark;
            --ink: #e8eef9;
            --muted: #93a0b5;
            --panel: #111827;
            --line: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font:
                14px / 1.45 Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #090d16;
            color: var(--ink);
        }
        main {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
            padding: 32px 0 42px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 22px;
        }
        .preview {
            min-height: 580px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: radial-gradient(circle at 50% 30%, #202942, #0c101b 62%);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        #snapshot {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        aside {
            align-self: start;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18, 25, 40, 0.8);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }
        label {
            display: block;
            margin: 0 0 7px;
            color: #bac5d7;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 11px;
            background: #0d1422;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6b82ee;
            box-shadow: 0 0 0 3px rgba(92, 116, 227, 0.15);
        }
        textarea {
            min-height: 230px;
            resize: vertical;
            font:
                12px / 1.55 ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }
        .field {
            margin-bottom: 15px;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            width: 100%;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font: 700 13px inherit;
            color: #091019;
            background: #8bf0be;
            box-shadow: 0 8px 18px rgba(88, 229, 162, 0.18);
        }
        button:hover {
            background: #b2f7d1;
        }
        button + button {
            margin-top: 9px;
            color: #dbe6fa;
            background: #202a3d;
            box-shadow: none;
        }
        .hint {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        @media (max-width: 800px) {
            main {
                width: min(100% - 24px, 620px);
                padding-top: 16px;
            }
            .workspace {
                grid-template-columns: 1fr;
            }
            .preview {
                min-height: 440px;
            }
            aside {
                order: -1;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <header><div class="brand">codeShowcase</div></header>
            <section class="workspace">
                <div class="preview"><img id="snapshot" alt="Rendered 3D code snippet card"></div>
                <aside>
                    <div class="field">
                        <label for="title">Window title</label>
                        <input id="title" value="hello.ts" maxlength="28">
                    </div>
                    <div class="field split">
                        <div>
                            <label for="language">Language</label
                            ><select id="language">
                                <option>TypeScript</option>
                                <option>JavaScript</option>
                                <option>Python</option>
                                <option>CSS</option>
                            </select>
                        </div>
                        <div>
                            <label for="theme">Theme</label
                            ><select id="theme">
                                <option value="midnight">Midnight</option>
                                <option value="monokai">Monokai</option>
                                <option value="darcula">Darcula</option>
                                <option value="solarized">Solarized Dark</option>
                                <option value="dracula">Dracula</option>
                                <option value="nord">Nord</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="code">Snippet</label
                        ><textarea id="code" spellcheck="false">const hello = (name: string) => {
  return `Hello, ${name}.`;
};

console.log(hello("[[world]]"));</textarea>
                    </div>
                    <button id="render">Render snapshot</button
                    ><button id="download">Download PNG</button>
                    <p class="hint">
                        Wrap text in <code>[[double brackets]]</code> to raise it above the code
                        surface.
                    </p>
                </aside>
            </section>
        </main>
        <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
        import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/loaders/FontLoader.js";
        import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/geometries/TextGeometry.js";

        const preview = document.querySelector(".preview"),
            image = document.querySelector("#snapshot");
        const themes = {
            midnight: {
                bg: "#101624",
                body: "#172033",
                screen: "#0a0f1b",
                bar: "#121a2a",
                text: "#d8e1f1",
                muted: "#4d5a72",
                keyword: "#8bf0be",
                type: "#dba5ff",
            },
            monokai: {
                bg: "#272822",
                body: "#3d3d34",
                screen: "#272822",
                bar: "#1f201c",
                text: "#f8f8f2",
                muted: "#75715e",
                keyword: "#f92672",
                type: "#66d9ef",
            },
            darcula: {
                bg: "#252526",
                body: "#3c3f41",
                screen: "#2b2b2b",
                bar: "#323232",
                text: "#a9b7c6",
                muted: "#5c6370",
                keyword: "#cc7832",
                type: "#a9b7c6",
            },
            solarized: {
                bg: "#002b36",
                body: "#073642",
                screen: "#002b36",
                bar: "#073642",
                text: "#93a1a1",
                muted: "#586e75",
                keyword: "#b58900",
                type: "#2aa198",
            },
            dracula: {
                bg: "#282a36",
                body: "#44475a",
                screen: "#282a36",
                bar: "#343746",
                text: "#f8f8f2",
                muted: "#6272a4",
                keyword: "#ff79c6",
                type: "#8be9fd",
            },
            nord: {
                bg: "#2e3440",
                body: "#434c5e",
                screen: "#2e3440",
                bar: "#3b4252",
                text: "#eceff4",
                muted: "#4c566a",
                keyword: "#88c0d0",
                type: "#b48ead",
            },
        };
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(themes.midnight.bg);
        const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
        camera.position.set(0, 1.2, 10.2);
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            preserveDrawingBuffer: true,
            alpha: false,
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const group = new THREE.Group();
        scene.add(group);
        scene.add(new THREE.HemisphereLight("#b8cbff", "#1b1a29", 1.8));
        const key = new THREE.DirectionalLight("#e5eeff", 3.1);
        key.position.set(-4, 6, 6);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.left = -8;
        key.shadow.camera.right = 8;
        key.shadow.camera.top = 8;
        key.shadow.camera.bottom = -8;
        scene.add(key);
        const rim = new THREE.PointLight("#718bff", 22, 16, 2);
        rim.position.set(5, 2, 2);
        scene.add(rim);
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.ShadowMaterial({ color: "#000000", opacity: 0.38 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -3.2;
        floor.receiveShadow = true;
        scene.add(floor);
        function roundedShape(w, h, r) {
            const x = -w / 2,
                y = -h / 2,
                s = new THREE.Shape();
            s.moveTo(x + r, y);
            s.lineTo(x + w - r, y);
            s.quadraticCurveTo(x + w, y, x + w, y + r);
            s.lineTo(x + w, y + h - r);
            s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            s.lineTo(x + r, y + h);
            s.quadraticCurveTo(x, y + h, x, y + h - r);
            s.lineTo(x, y + r);
            s.quadraticCurveTo(x, y, x + r, y);
            return s;
        }
        const bodyMaterial = new THREE.MeshStandardMaterial({
                color: themes.midnight.body,
                metalness: 0.38,
                roughness: 0.34,
            }),
            body = new THREE.Mesh(
                new THREE.ExtrudeGeometry(roundedShape(7.3, 4.6, 0.28), {
                    depth: 0.18,
                    bevelEnabled: true,
                    bevelSegments: 3,
                    bevelSize: 0.07,
                    bevelThickness: 0.08,
                }),
                bodyMaterial,
            );
        body.position.z = -0.12;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        const screenMaterial = new THREE.MeshBasicMaterial({ color: themes.midnight.screen }),
            screen = new THREE.Mesh(
                new THREE.ShapeGeometry(roundedShape(7.06, 4.36, 0.2)),
                screenMaterial,
            );
        screen.position.z = 0.15;
        group.add(screen);
        const barMaterial = new THREE.MeshBasicMaterial({ color: themes.midnight.bar }),
            topbar = new THREE.Mesh(new THREE.PlaneGeometry(7.0, 0.64), barMaterial);
        topbar.position.set(0, 1.84, 0.161);
        group.add(topbar);
        const codeCanvas = document.createElement("canvas"),
            ctx = codeCanvas.getContext("2d");
        codeCanvas.width = 1400;
        codeCanvas.height = 800;
        const codeTexture = new THREE.CanvasTexture(codeCanvas);
        codeTexture.colorSpace = THREE.SRGBColorSpace;
        const codeMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(6.72, 3.42),
            new THREE.MeshBasicMaterial({ map: codeTexture, transparent: true }),
        );
        codeMesh.position.set(0.05, -0.28, 0.17);
        group.add(codeMesh);
        [
            ["#ff6259", -3.12],
            ["#ffbd44", -2.82],
            ["#00ca4e", -2.52],
        ].forEach(([color, x]) => {
            const dot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.11, 0.045, 12, 1, false),
                new THREE.MeshStandardMaterial({
                    color,
                    roughness: 0.56,
                    metalness: 0.05,
                    flatShading: true,
                }),
            );
            dot.rotation.x = Math.PI / 2;
            dot.position.set(x, 1.84, 0.3);
            dot.castShadow = true;
            group.add(dot);
        });
        const titleTexture = new THREE.CanvasTexture(document.createElement("canvas"));
        titleTexture.image.width = 600;
        titleTexture.image.height = 80;
        const titleMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 0.33),
            new THREE.MeshBasicMaterial({ map: titleTexture, transparent: true }),
        );
        titleMesh.position.set(0.25, 1.84, 0.18);
        group.add(titleMesh);
        const popGroup = new THREE.Group();
        group.add(popGroup);
        let font;
        new FontLoader().load(
            "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/fonts/helvetiker_regular.typeface.json",
            (loaded) => {
                font = loaded;
                update();
            },
        );
        function disposePops() {
            while (popGroup.children.length) {
                const mesh = popGroup.children.pop();
                mesh.geometry.dispose();
                mesh.material.dispose();
            }
        }
        function draw() {
            const code = document.querySelector("#code").value,
                title = document.querySelector("#title").value || "untitled",
                language = document.querySelector("#language").value,
                theme = themes[document.querySelector("#theme").value];
            scene.background.set(theme.bg);
            bodyMaterial.color.set(theme.body);
            screenMaterial.color.set(theme.screen);
            barMaterial.color.set(theme.bar);
            ctx.clearRect(0, 0, 1400, 800);
            ctx.fillStyle = theme.screen;
            ctx.fillRect(0, 0, 1400, 800);
            ctx.font = "31px ui-monospace, Menlo, monospace";
            ctx.textBaseline = "middle";
            disposePops();
            const lines = code.split("\n");
            lines.forEach((rawLine, i) => {
                const line = rawLine.replace(/\[\[(.*?)\]\]/g, "$1");
                let y = 76 + i * 57;
                ctx.fillStyle = theme.muted;
                ctx.fillText(String(i + 1).padStart(2, " "), 45, y);
                const chunks = line.split(
                    /(const|let|return|console|log|function|def|class|import|from|if|else|string|true|false)/g,
                );
                let x = 142;
                chunks.forEach((chunk) => {
                    ctx.fillStyle =
                        /^(const|let|return|console|log|function|def|class|import|from|if|else)$/.test(
                            chunk,
                        )
                            ? theme.keyword
                            : /^(string|true|false)$/.test(chunk)
                              ? theme.type
                              : theme.text;
                    ctx.fillText(chunk, x, y);
                    x += ctx.measureText(chunk).width;
                });
                if (font)
                    [...rawLine.matchAll(/\[\[(.*?)\]\]/g)].forEach((match) => {
                        const before = rawLine
                                .slice(0, match.index)
                                .replace(/\[\[(.*?)\]\]/g, "$1"),
                            px = 142 + ctx.measureText(before).width,
                            geometry = new TextGeometry(match[1], {
                                font,
                                size: 31,
                                height: 13,
                                curveSegments: 3,
                                bevelEnabled: true,
                                bevelThickness: 2,
                                bevelSize: 0.7,
                                bevelSegments: 2,
                            }),
                            mesh = new THREE.Mesh(
                                geometry,
                                new THREE.MeshStandardMaterial({
                                    color: theme.keyword,
                                    roughness: 0.28,
                                    metalness: 0.12,
                                }),
                            );
                        mesh.scale.setScalar(0.006);
                        mesh.position.set(
                            0.05 - 3.36 + (px / 1400) * 6.72,
                            -0.28 + 1.71 - (y / 800) * 3.42,
                            0.27,
                        );
                        mesh.castShadow = true;
                        popGroup.add(mesh);
                    });
            });
            ctx.fillStyle = theme.keyword;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(42, 665, 9, 34);
            ctx.globalAlpha = 1;
            ctx.font = "23px ui-sans-serif, sans-serif";
            ctx.fillStyle = theme.muted;
            ctx.fillText(language.toUpperCase(), 75, 684);
            codeTexture.needsUpdate = true;
            const t = titleTexture.image.getContext("2d");
            t.clearRect(0, 0, 600, 80);
            t.font = "32px ui-sans-serif, system-ui";
            t.textAlign = "center";
            t.textBaseline = "middle";
            t.fillStyle = "#bac6d9";
            t.fillText(title, 300, 40);
            titleTexture.needsUpdate = true;
        }
        function snapshot() {
            const w = preview.clientWidth,
                h = preview.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
            image.src = renderer.domElement.toDataURL("image/png");
        }
        function update() {
            draw();
            snapshot();
        }
        let updateTimer;
        const scheduleUpdate = () => {
            clearTimeout(updateTimer);
            updateTimer = setTimeout(update, 180);
        };
        document
            .querySelectorAll("input, textarea, select")
            .forEach((field) => field.addEventListener("input", scheduleUpdate));
        document.querySelector("#render").addEventListener("click", update);
        document.querySelector("#download").addEventListener("click", () => {
            snapshot();
            const a = document.createElement("a");
            a.href = renderer.domElement.toDataURL("image/png");
            a.download = "code-showcase.png";
            a.click();
        });
        new ResizeObserver(snapshot).observe(preview);
        update();
        </script>
    </body>
</html>
