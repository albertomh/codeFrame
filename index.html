<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >
        <meta name="description" content="A tiny 3D code snippet showcase.">
        <title>codeShowcase</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Reddit+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap"
            rel="stylesheet"
        >
        <style>
        :root {
            color-scheme: dark;
            --ink: #e8eef9;
            --muted: #93a0b5;
            --panel: #111827;
            --line: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font:
                14px / 1.45 Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #090d16;
            color: var(--ink);
        }
        main {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
            padding: 32px 0 42px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 22px;
        }
        .preview {
            min-height: 580px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: radial-gradient(circle at 50% 30%, #202942, #0c101b 62%);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        #snapshot {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        aside {
            align-self: start;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18, 25, 40, 0.8);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }
        label {
            display: block;
            margin: 0 0 7px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 11px;
            background: #0d1422;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6b82ee;
            box-shadow: 0 0 0 3px rgba(92, 116, 227, 0.15);
        }
        textarea {
            min-height: 230px;
            resize: vertical;
            font:
                12px / 1.55 var(--editor-font, "Fira Code"),
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }
        .field {
            margin-bottom: 15px;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            width: 100%;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font: 700 13px inherit;
            color: #091019;
            background: #8bf0be;
            box-shadow: 0 8px 18px rgba(88, 229, 162, 0.18);
        }
        button:hover {
            background: #b2f7d1;
        }
        button + button {
            margin-top: 9px;
            color: #dbe6fa;
            background: #202a3d;
            box-shadow: none;
        }
        .hint {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        .code-hint {
            margin: -1px 0 8px;
        }
        @media (max-width: 800px) {
            main {
                width: min(100% - 24px, 620px);
                padding-top: 16px;
            }
            .workspace {
                grid-template-columns: 1fr;
            }
            .preview {
                min-height: 440px;
            }
            aside {
                order: -1;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <header><div class="brand">codeShowcase</div></header>
            <section class="workspace">
                <div class="preview"><img id="snapshot" alt="Rendered 3D code snippet card"></div>
                <aside>
                    <div class="field">
                        <label for="title">Window title</label>
                        <input id="title" value="hello.ts" maxlength="28">
                    </div>
                    <div class="field split">
                        <div>
                            <label for="language">Language</label
                            ><select id="language">
                                <option>TypeScript</option>
                                <option>JavaScript</option>
                                <option>Python</option>
                                <option>CSS</option>
                            </select>
                        </div>
                        <div>
                            <label for="theme">Theme</label
                            ><select id="theme">
                                <option value="midnight">Midnight</option>
                                <option value="monokai">Monokai</option>
                                <option value="darcula">Darcula</option>
                                <option value="solarized">Solarized Dark</option>
                                <option value="dracula">Dracula</option>
                                <option value="nord">Nord</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label for="font">IDE font</label
                        ><select id="font">
                            <option>Fira Code</option>
                            <option>Reddit Mono</option>
                            <option>JetBrains Mono</option>
                            <option>IBM Plex Mono</option>
                            <option>Source Code Pro</option>
                            <option>Roboto Mono</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="camera">Camera</label
                        ><select id="camera">
                            <option value="studio">Studio angle</option>
                            <option value="front">Front</option>
                            <option value="left">Left angle</option>
                            <option value="right">Right angle</option>
                            <option value="high">High angle</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="code">Snippet</label>
                        <p class="hint code-hint">
                            Wrap text in <code>[[double brackets]]</code> to render it as a flush 3D
                            layer.
                        </p>
                        <textarea id="code" spellcheck="false">const hello = (name: string) => {
  return `Hello, ${name}.`;
};

console.log(hello("[[world]]"));</textarea>
                    </div>
                    <button id="render">Render snapshot</button
                    ><button id="download">Download PNG</button>
                </aside>
            </section>
        </main>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
            }
        }
        </script>
        <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

        const preview = document.querySelector(".preview"),
            image = document.querySelector("#snapshot");
        const themes = {
            midnight: {
                bg: "#101624",
                body: "#172033",
                screen: "#0a0f1b",
                bar: "#121a2a",
                text: "#d8e1f1",
                muted: "#4d5a72",
                keyword: "#8bf0be",
                type: "#dba5ff",
            },
            monokai: {
                bg: "#272822",
                body: "#3d3d34",
                screen: "#272822",
                bar: "#1f201c",
                text: "#f8f8f2",
                muted: "#75715e",
                keyword: "#f92672",
                type: "#66d9ef",
            },
            darcula: {
                bg: "#252526",
                body: "#3c3f41",
                screen: "#2b2b2b",
                bar: "#323232",
                text: "#a9b7c6",
                muted: "#5c6370",
                keyword: "#cc7832",
                type: "#a9b7c6",
            },
            solarized: {
                bg: "#002b36",
                body: "#073642",
                screen: "#002b36",
                bar: "#073642",
                text: "#93a1a1",
                muted: "#586e75",
                keyword: "#b58900",
                type: "#2aa198",
            },
            dracula: {
                bg: "#282a36",
                body: "#44475a",
                screen: "#282a36",
                bar: "#343746",
                text: "#f8f8f2",
                muted: "#6272a4",
                keyword: "#ff79c6",
                type: "#8be9fd",
            },
            nord: {
                bg: "#2e3440",
                body: "#434c5e",
                screen: "#2e3440",
                bar: "#3b4252",
                text: "#eceff4",
                muted: "#4c566a",
                keyword: "#88c0d0",
                type: "#b48ead",
            },
        };
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(themes.midnight.bg);
        const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            preserveDrawingBuffer: true,
            alpha: false,
        });
        renderer.setPixelRatio(Math.min(3, Math.max(2, devicePixelRatio || 1)));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        const group = new THREE.Group();
        scene.add(group);
        scene.add(new THREE.HemisphereLight("#b8cbff", "#1b1a29", 1.8));
        const key = new THREE.DirectionalLight("#e5eeff", 3.1);
        key.position.set(-4, 6, 6);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.left = -8;
        key.shadow.camera.right = 8;
        key.shadow.camera.top = 8;
        key.shadow.camera.bottom = -8;
        scene.add(key);
        const rim = new THREE.PointLight("#718bff", 22, 16, 2);
        rim.position.set(5, 2, 2);
        scene.add(rim);
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.ShadowMaterial({ color: "#000000", opacity: 0.38 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -3.2;
        floor.receiveShadow = true;
        scene.add(floor);
        function roundedShape(w, h, r) {
            const x = -w / 2,
                y = -h / 2,
                s = new THREE.Shape();
            s.moveTo(x + r, y);
            s.lineTo(x + w - r, y);
            s.quadraticCurveTo(x + w, y, x + w, y + r);
            s.lineTo(x + w, y + h - r);
            s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            s.lineTo(x + r, y + h);
            s.quadraticCurveTo(x, y + h, x, y + h - r);
            s.lineTo(x, y + r);
            s.quadraticCurveTo(x, y, x + r, y);
            return s;
        }
        function titlebarShape(w, h, r) {
            const x = -w / 2,
                y = -h / 2,
                s = new THREE.Shape();
            s.moveTo(x, y);
            s.lineTo(x + w, y);
            s.lineTo(x + w, y + h - r);
            s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            s.lineTo(x + r, y + h);
            s.quadraticCurveTo(x, y + h, x, y + h - r);
            s.lineTo(x, y);
            return s;
        }
        const bodyMaterial = new THREE.MeshStandardMaterial({
                color: themes.midnight.body,
                metalness: 0.38,
                roughness: 0.34,
            }),
            body = new THREE.Mesh(
                new THREE.ExtrudeGeometry(roundedShape(7.3, 4.6, 0.28), {
                    depth: 0.18,
                    bevelEnabled: true,
                    bevelSegments: 3,
                    bevelSize: 0.07,
                    bevelThickness: 0.08,
                }),
                bodyMaterial,
            );
        body.position.z = -0.12;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        const screenMaterial = new THREE.MeshBasicMaterial({ color: themes.midnight.screen }),
            screen = new THREE.Mesh(
                new THREE.ShapeGeometry(roundedShape(7.06, 4.36, 0.2)),
                screenMaterial,
            );
        screen.position.z = 0.15;
        group.add(screen);
        const barMaterial = new THREE.MeshBasicMaterial({ color: themes.midnight.bar }),
            topbar = new THREE.Mesh(
                new THREE.ShapeGeometry(titlebarShape(7.06, 0.64, 0.2)),
                barMaterial,
            );
        topbar.position.set(0, 1.84, 0.161);
        group.add(topbar);
        const codeCanvas = document.createElement("canvas"),
            ctx = codeCanvas.getContext("2d");
        codeCanvas.width = 1400;
        codeCanvas.height = 800;
        const codeTexture = new THREE.CanvasTexture(codeCanvas);
        codeTexture.colorSpace = THREE.SRGBColorSpace;
        codeTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const codeMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(6.72, 3.42),
            new THREE.MeshBasicMaterial({ map: codeTexture, transparent: true }),
        );
        codeMesh.position.set(0.05, -0.28, 0.17);
        group.add(codeMesh);
        [
            ["#ff6259", -3.12],
            ["#ffbd44", -2.82],
            ["#00ca4e", -2.52],
        ].forEach(([color, x]) => {
            const dot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.11, 0.045, 48, 1, false),
                new THREE.MeshStandardMaterial({
                    color,
                    roughness: 0.56,
                    metalness: 0.05,
                    flatShading: true,
                }),
            );
            dot.rotation.x = Math.PI / 2;
            dot.position.set(x, 1.84, 0.3);
            dot.castShadow = true;
            group.add(dot);
        });
        const titleTexture = new THREE.CanvasTexture(document.createElement("canvas"));
        titleTexture.image.width = 600;
        titleTexture.image.height = 80;
        const titleMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 0.33),
            new THREE.MeshBasicMaterial({ map: titleTexture, transparent: true }),
        );
        titleMesh.position.set(0.25, 1.84, 0.18);
        group.add(titleMesh);
        const popGroup = new THREE.Group();
        group.add(popGroup);
        function disposePops() {
            while (popGroup.children.length) {
                const mesh = popGroup.children.pop();
                mesh.geometry.dispose();
                mesh.material.map.dispose();
                mesh.material.dispose();
            }
        }
        function codeColor(token, theme) {
            return /^(const|let|return|console|log|function|def|class|import|from|if|else)$/.test(
                token,
            )
                ? theme.keyword
                : /^(string|true|false)$/.test(token)
                  ? theme.type
                  : theme.text;
        }
        function addFlushText(text, px, y, color) {
            const width = Math.ceil(ctx.measureText(text).width) + 2,
                tile = document.createElement("canvas"),
                tileCtx = tile.getContext("2d");
            tile.width = width;
            tile.height = 57;
            tileCtx.font = ctx.font;
            tileCtx.textBaseline = "middle";
            tileCtx.fillStyle = color;
            tileCtx.fillText(text, 0, 28.5);
            const texture = new THREE.CanvasTexture(tile);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry((tile.width / 1400) * 6.72, (tile.height / 800) * 3.42),
                new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false }),
            );
            mesh.position.set(
                0.05 - 3.36 + ((px + tile.width / 2) / 1400) * 6.72,
                -0.28 + 1.71 - (y / 800) * 3.42,
                0.181,
            );
            mesh.renderOrder = 1;
            popGroup.add(mesh);
        }
        function draw() {
            const code = document.querySelector("#code").value,
                title = document.querySelector("#title").value || "untitled",
                language = document.querySelector("#language").value,
                theme = themes[document.querySelector("#theme").value],
                fontName = document.querySelector("#font").value,
                editorFont = `"${fontName}", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
            document.documentElement.style.setProperty("--editor-font", `"${fontName}"`);
            scene.background.set(theme.bg);
            bodyMaterial.color.set(theme.body);
            screenMaterial.color.set(theme.screen);
            barMaterial.color.set(theme.bar);
            ctx.clearRect(0, 0, 1400, 800);
            ctx.fillStyle = theme.screen;
            ctx.fillRect(0, 0, 1400, 800);
            ctx.font = `31px ${editorFont}`;
            ctx.textBaseline = "middle";
            disposePops();
            const lines = code.split("\n");
            lines.forEach((rawLine, i) => {
                const line = rawLine.replace(/\[\[(.*?)\]\]/g, "$1");
                let y = 76 + i * 57;
                ctx.fillStyle = theme.muted;
                ctx.fillText(String(i + 1).padStart(2, " "), 45, y);
                const chunks = line.split(
                    /(const|let|return|console|log|function|def|class|import|from|if|else|string|true|false)/g,
                );
                let x = 142;
                chunks.forEach((chunk) => {
                    ctx.fillStyle = codeColor(chunk, theme);
                    ctx.fillText(chunk, x, y);
                    x += ctx.measureText(chunk).width;
                });
                [...rawLine.matchAll(/\[\[(.*?)\]\]/g)].forEach((match) => {
                    const before = rawLine.slice(0, match.index).replace(/\[\[(.*?)\]\]/g, "$1"),
                        px = 142 + ctx.measureText(before).width;
                    addFlushText(match[1], px, y, codeColor(match[1], theme));
                });
            });
            ctx.fillStyle = theme.keyword;
            ctx.globalAlpha = 0.85;
            ctx.fillRect(42, 665, 9, 34);
            ctx.globalAlpha = 1;
            ctx.font = "23px ui-sans-serif, sans-serif";
            ctx.fillStyle = theme.muted;
            ctx.fillText(language.toUpperCase(), 75, 684);
            codeTexture.needsUpdate = true;
            const t = titleTexture.image.getContext("2d");
            t.clearRect(0, 0, 600, 80);
            t.font = `26px ${editorFont}`;
            t.textAlign = "center";
            t.textBaseline = "middle";
            t.fillStyle = "#bac6d9";
            t.fillText(title, 300, 40);
            titleTexture.needsUpdate = true;
        }
        const cameraPresets = {
            studio: [5.5, 3.5, 10.5],
            front: [0, 1.2, 11.2],
            left: [-6, 2.8, 9.4],
            right: [6, 2.8, 9.4],
            high: [2.4, 6.8, 8.8],
        };
        function applyCamera() {
            const [x, y, z] = cameraPresets[document.querySelector("#camera").value];
            camera.position.set(x, y, z);
            camera.lookAt(0, 0.05, 0);
        }
        function snapshot() {
            const w = preview.clientWidth,
                h = preview.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
            image.src = renderer.domElement.toDataURL("image/png");
        }
        function update() {
            draw();
            applyCamera();
            snapshot();
        }
        let updateTimer;
        const scheduleUpdate = () => {
            clearTimeout(updateTimer);
            updateTimer = setTimeout(update, 180);
        };
        document
            .querySelectorAll("input, textarea, select")
            .forEach((field) => field.addEventListener("input", scheduleUpdate));
        document
            .querySelector("#font")
            .addEventListener("change", () =>
                document.fonts.load(`31px "${document.querySelector("#font").value}"`).then(update),
            );
        document.querySelector("#render").addEventListener("click", update);
        document.querySelector("#download").addEventListener("click", () => {
            snapshot();
            const a = document.createElement("a");
            a.href = renderer.domElement.toDataURL("image/png");
            a.download = "code-showcase.png";
            a.click();
        });
        new ResizeObserver(snapshot).observe(preview);
        document.fonts.ready.then(update);
        update();
        </script>
    </body>
</html>
