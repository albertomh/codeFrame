<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >
        <meta name="description" content="A tiny 3D code snippet showcase.">
        <title>codeShowcase</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Reddit+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap"
            rel="stylesheet"
        >
        <style>
        :root {
            color-scheme: dark;
            --ink: #e8eef9;
            --muted: #93a0b5;
            --panel: #111827;
            --line: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font:
                14px / 1.45 Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #090d16;
            color: var(--ink);
        }
        main {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
            padding: 32px 0 42px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 22px;
        }
        .preview {
            min-height: 580px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: radial-gradient(circle at 50% 30%, #202942, #0c101b 62%);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        #snapshot,
        .live-canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview.free-view #snapshot {
            visibility: hidden;
        }
        .live-canvas {
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }
        .live-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }
        #nav-gizmo {
            position: absolute;
            z-index: 2;
            right: 14px;
            bottom: 14px;
            display: none;
            width: 118px;
            height: 118px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(8, 13, 23, 0.72);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            cursor: grab;
            touch-action: none;
        }
        #nav-gizmo.active {
            display: grid;
        }
        #nav-gizmo:active {
            cursor: grabbing;
        }
        #nav-gizmo canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #zoom-indicator {
            position: absolute;
            z-index: 2;
            left: 14px;
            bottom: 14px;
            display: none;
            width: 52px;
            padding: 6px 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            color: #fff;
            background: rgba(8, 13, 23, 0.72);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }
        #zoom-indicator.active {
            display: block;
        }
        aside {
            align-self: start;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18, 25, 40, 0.8);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }
        label {
            display: block;
            margin: 0 0 7px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 7px;
        }
        .range-label label {
            margin: 0;
        }
        .range-label output {
            font-variant-numeric: tabular-nums;
        }
        .range-value {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reset-height {
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            padding: 0;
            border: 0;
            border-radius: 5px;
            color: #dce8fb;
            background: transparent;
            box-shadow: none;
        }
        .reset-height:hover {
            color: #fff;
            background: #243149;
        }
        .reset-height svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .reset-height .restore-icon {
            fill: currentColor;
            stroke: none;
        }
        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 11px;
            background: #0d1422;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        input[type="range"] {
            padding: 0;
            accent-color: #8bf0be;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6b82ee;
            box-shadow: 0 0 0 3px rgba(92, 116, 227, 0.15);
        }
        textarea {
            min-height: 230px;
            resize: vertical;
            font:
                12px / 1.55 var(--editor-font, "Fira Code"),
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }
        .field {
            margin-bottom: 15px;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .camera-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .camera-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .camera-button:hover {
            color: #fff;
            background: #172238;
        }
        .camera-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .camera-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .language-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .language-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .language-button:hover {
            color: #fff;
            background: #172238;
        }
        .language-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .language-button::before {
            width: 20px;
            height: 20px;
            content: "";
            background: currentColor;
            -webkit-mask: var(--language-icon) center / contain no-repeat;
            mask: var(--language-icon) center / contain no-repeat;
        }
        .language-button[data-language="TypeScript"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/typescript.svg");
        }
        .language-button[data-language="JavaScript"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/javascript.svg");
        }
        .language-button[data-language="Python"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/python.svg");
        }
        .language-button[data-language="CSS"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/css.svg");
        }
        .language-button[data-language="HTML"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/html5.svg");
        }
        .camera-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .camera-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .camera-button:hover {
            color: #fff;
            background: #172238;
        }
        .camera-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .camera-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .camera-button.free-view .axis-x {
            stroke: #7181ff;
        }
        .camera-button.free-view .axis-y {
            stroke: #91e800;
        }
        .camera-button.free-view .axis-z {
            stroke: #ff5262;
        }
        .camera-button.free-view circle.axis-x {
            fill: #7181ff;
        }
        .camera-button.free-view circle.axis-y {
            fill: #91e800;
        }
        .camera-button.free-view circle.axis-z {
            fill: #ff5262;
        }
        button {
            width: 100%;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font: 700 13px inherit;
            color: #091019;
            background: #8bf0be;
            box-shadow: 0 8px 18px rgba(88, 229, 162, 0.18);
        }
        button:hover {
            background: #b2f7d1;
        }
        #download {
            color: #dbe6fa;
            background: #202a3d;
            box-shadow: none;
        }
        .hint {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        .code-hint {
            margin: -1px 0 8px;
        }
        @media (max-width: 800px) {
            main {
                width: min(100% - 24px, 620px);
                padding-top: 16px;
            }
            .workspace {
                grid-template-columns: 1fr;
            }
            .preview {
                min-height: 440px;
            }
            aside {
                order: -1;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <header><div class="brand">codeShowcase</div></header>
            <section class="workspace">
                <div class="preview">
                    <img id="snapshot" alt="Rendered 3D code snippet card">
                    <div id="zoom-indicator" aria-live="polite">0%</div>
                    <div
                        id="nav-gizmo"
                        role="application"
                        aria-label="Viewport navigation gizmo: drag to rotate or click an axis to snap the view"
                        title="Drag to rotate; click an axis to snap; scroll scene to zoom"
                    ></div>
                </div>
                <aside>
                    <div class="field">
                        <label for="title">Window title</label>
                        <input id="title" value="hello.ts" maxlength="28">
                    </div>
                    <div class="field">
                        <label>Language</label>
                        <input id="language" type="hidden" value="TypeScript">
                        <div
                            class="language-options"
                            role="group"
                            aria-label="Syntax highlighting language"
                        >
                            <button
                                class="language-button active"
                                type="button"
                                data-language="TypeScript"
                                aria-label="TypeScript"
                                aria-pressed="true"
                                title="TypeScript"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="JavaScript"
                                aria-label="JavaScript"
                                aria-pressed="false"
                                title="JavaScript"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="Python"
                                aria-label="Python"
                                aria-pressed="false"
                                title="Python"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="CSS"
                                aria-label="CSS"
                                aria-pressed="false"
                                title="CSS"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="HTML"
                                aria-label="HTML"
                                aria-pressed="false"
                                title="HTML"
                            ></button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="theme">Theme</label
                        ><select id="theme">
                            <option value="midnight">Midnight</option>
                            <option value="monokai">Monokai</option>
                            <option value="darcula">Darcula</option>
                            <option value="solarized">Solarized</option>
                            <option value="dracula">Dracula</option>
                            <option value="nord">Nord</option>
                            <option value="contrastLight">High Contrast Light</option>
                            <option value="contrastDark">High Contrast Dark</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="font">IDE font</label
                        ><select id="font">
                            <option>Fira Code</option>
                            <option>Reddit Mono</option>
                            <option>JetBrains Mono</option>
                            <option>IBM Plex Mono</option>
                            <option>Source Code Pro</option>
                            <option>Roboto Mono</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="range-label" for="font-size"
                            ><span>IDE font size</span
                            ><output id="font-size-value">31 px</output></label
                        ><input id="font-size" type="range" min="20" max="42" step="1" value="31">
                    </div>
                    <div class="field">
                        <label>Camera</label>
                        <div class="camera-options" role="group" aria-label="Camera angle">
                            <button
                                class="camera-button active"
                                type="button"
                                data-camera="front"
                                aria-label="Front view"
                                aria-pressed="true"
                                title="Front view"
                            >
                                <svg viewBox="0 0 24 24">
                                    <rect x="4" y="5" width="16" height="12" rx="2" />
                                    <path d="M8 20h8M12 17v3" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="studio"
                                aria-label="Studio angle"
                                aria-pressed="false"
                                title="Studio angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m3 8 9-4 9 4-9 4zM3 8v8l9 4 9-4V8M12 12v8" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="left"
                                aria-label="Left angle"
                                aria-pressed="false"
                                title="Left angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m4 8 12-4 4 3v10L8 21 4 18zM4 8l4 3v10M8 11l12-4" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="right"
                                aria-label="Right angle"
                                aria-pressed="false"
                                title="Right angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m20 8-12-4-4 3v10l12 4 4-3zM20 8l-4 3v10M16 11 4 7" />
                                </svg>
                            </button>
                            <button
                                class="camera-button free-view"
                                type="button"
                                data-camera="free"
                                aria-label="Free view: drag preview to rotate"
                                aria-pressed="false"
                                title="Free view"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path class="axis-x" d="m12 13 7 4" />
                                    <circle class="axis-x" cx="19" cy="17" r="2.1" />
                                    <path class="axis-y" d="M12 13V5" />
                                    <circle class="axis-y" cx="12" cy="5" r="2.1" />
                                    <path class="axis-z" d="m12 13-7 4" />
                                    <circle class="axis-z" cx="5" cy="17" r="2.1" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label>Lighting</label>
                        <div class="lighting-options" role="group" aria-label="Scene lighting">
                            <button
                                class="lighting-button active"
                                type="button"
                                data-lighting="studio"
                                aria-label="Studio lighting"
                                aria-pressed="true"
                                title="Studio"
                            >
                                <svg viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="3" />
                                    <path
                                        d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"
                                    />
                                </svg>
                            </button>
                            <button
                                class="lighting-button"
                                type="button"
                                data-lighting="soft"
                                aria-label="Soft lighting"
                                aria-pressed="false"
                                title="Soft"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M6 17h11a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7 10.5 3.3 3.3 0 0 0 6 17z"
                                    />
                                </svg>
                            </button>
                            <button
                                class="lighting-button"
                                type="button"
                                data-lighting="sunset"
                                aria-label="Sunset lighting"
                                aria-pressed="false"
                                title="Sunset"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M3 18h18M6 14a6 6 0 0 1 12 0M12 4v3M5 7l2 2M19 7l-2 2"
                                    />
                                </svg>
                            </button>
                            <button
                                class="lighting-button"
                                type="button"
                                data-lighting="noir"
                                aria-label="Noir lighting"
                                aria-pressed="false"
                                title="Noir"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="M16 4a7 7 0 1 0 4 12A7 7 0 0 1 16 4z" />
                                </svg>
                            </button>
                            <button
                                class="lighting-button"
                                type="button"
                                data-lighting="neon"
                                aria-label="Neon lighting"
                                aria-pressed="false"
                                title="Neon"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m13 2-9 12h7l-1 8 10-13h-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <div class="range-label">
                            <label for="pop-height">3D text height</label
                            ><span class="range-value"
                                ><output id="pop-height-value">0.040</output
                                ><button
                                    id="reset-pop-height"
                                    class="reset-height"
                                    type="button"
                                    aria-label="Restore default 3D text height"
                                    title="Restore default height"
                                >
                                    <svg
                                        class="restore-icon"
                                        viewBox="0 0 16 16"
                                        aria-hidden="true"
                                    >
                                        <path
                                            fill-rule="evenodd"
                                            d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"
                                        />
                                        <path
                                            d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"
                                        />
                                    </svg>
                                </button></span
                            >
                        </div>
                        <input
                            id="pop-height"
                            type="range"
                            min="0"
                            max="0.3"
                            step="0.001"
                            value="0.040"
                        >
                    </div>
                    <div class="field">
                        <label for="code">Snippet</label>
                        <p class="hint code-hint">
                            Wrap text in <code>[[double brackets]]</code> to render it as a flush 3D
                            layer.
                        </p>
                        <textarea id="code" spellcheck="false">const hello = (name: string) => {
  return `Hello, ${name}.`;
};

console.log(hello("[[world]]"));</textarea>
                    </div>
                    <button id="download">Download PNG</button>
                </aside>
            </section>
        </main>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
            }
        }
        </script>
        <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js";

        const preview = document.querySelector(".preview"),
            image = document.querySelector("#snapshot"),
            gizmo = document.querySelector("#nav-gizmo"),
            zoomIndicator = document.querySelector("#zoom-indicator");
        const themes = {
            midnight: {
                bg: "#101624",
                body: "#172033",
                screen: "#0a0f1b",
                bar: "#121a2a",
                text: "#d8e1f1",
                muted: "#4d5a72",
                keyword: "#8bf0be",
                type: "#dba5ff",
            },
            monokai: {
                bg: "#272822",
                body: "#3d3d34",
                screen: "#272822",
                bar: "#1f201c",
                text: "#f8f8f2",
                muted: "#75715e",
                keyword: "#f92672",
                type: "#66d9ef",
            },
            darcula: {
                bg: "#252526",
                body: "#3c3f41",
                screen: "#2b2b2b",
                bar: "#323232",
                text: "#a9b7c6",
                muted: "#5c6370",
                keyword: "#cc7832",
                type: "#a9b7c6",
            },
            solarized: {
                bg: "#fdf6e3",
                body: "#eee8d5",
                screen: "#fdf6e3",
                bar: "#586e75",
                text: "#586e75",
                muted: "#93a1a1",
                keyword: "#b58900",
                type: "#2aa198",
            },
            dracula: {
                bg: "#282a36",

                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();
            }),
        );
        document.querySelector("#download").addEventListener("click", () => {
            snapshot();
            const a = document.createElement("a");
            a.href = renderer.domElement.toDataURL("image/png");
            a.download = "code-showcase.png";
            a.click();
        });
        new ResizeObserver(snapshot).observe(preview);
        document.fonts.ready.then(update);
        update();
        document.querySelectorAll(".language-button").forEach((button) =>
            button.addEventListener("click", () => {
                document.querySelector("#language").value = button.dataset.language;
                document.querySelectorAll(".language-button").forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();
            }),
        );
        </script>
    </body>
</html>
