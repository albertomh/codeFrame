<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >
        <meta name="description" content="A tiny 3D code snippet showcase.">
        <title>codeShowcase</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Reddit+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&family=Source+Code+Pro:wght@400;500&display=swap"
            rel="stylesheet"
        >
        <style>
        :root {
            color-scheme: dark;
            --ink: #e8eef9;
            --muted: #93a0b5;
            --panel: #111827;
            --line: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font:
                14px / 1.45 Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #090d16;
            color: var(--ink);
        }
        main {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
            padding: 32px 0 42px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 22px;
        }
        .preview {
            min-height: 580px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: radial-gradient(circle at 50% 30%, #202942, #0c101b 62%);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        #snapshot,
        .live-canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .live-canvas {
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }
        .live-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }
        #nav-gizmo {
            position: absolute;
            z-index: 2;
            right: 14px;
            bottom: 14px;
            display: none;
            width: 118px;
            height: 118px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(8, 13, 23, 0.72);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            cursor: grab;
            touch-action: none;
        }
        #nav-gizmo.active {
            display: grid;
        }
        #nav-gizmo:active {
            cursor: grabbing;
        }
        #nav-gizmo canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        aside {
            align-self: start;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18, 25, 40, 0.8);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }
        label {
            display: block;
            margin: 0 0 7px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .range-label output {
            font-variant-numeric: tabular-nums;
        }
        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 11px;
            background: #0d1422;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        input[type="range"] {
            padding: 0;
            accent-color: #8bf0be;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6b82ee;
            box-shadow: 0 0 0 3px rgba(92, 116, 227, 0.15);
        }
        textarea {
            min-height: 230px;
            resize: vertical;
            font:
                12px / 1.55 var(--editor-font, "Fira Code"),
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }
        .field {
            margin-bottom: 15px;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .camera-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .camera-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .camera-button:hover {
            color: #fff;
            background: #172238;
        }
        .camera-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .camera-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .language-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .language-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .language-button:hover {
            color: #fff;
            background: #172238;
        }
        .language-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .language-button::before {
            width: 20px;
            height: 20px;
            content: "";
            background: currentColor;
            -webkit-mask: var(--language-icon) center / contain no-repeat;
            mask: var(--language-icon) center / contain no-repeat;
        }
        .language-button[data-language="TypeScript"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/typescript.svg");
        }
        .language-button[data-language="JavaScript"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/javascript.svg");
        }
        .language-button[data-language="Python"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/python.svg");
        }
        .language-button[data-language="CSS"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/css.svg");
        }
        .language-button[data-language="HTML"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/html5.svg");
        }
        .camera-button.free-view .axis-x {
            stroke: #7181ff;
        }
        .camera-button.free-view .axis-y {
            stroke: #91e800;
        }
        .camera-button.free-view .axis-z {
            stroke: #ff5262;
        }
        .camera-button.free-view circle.axis-x {
            fill: #7181ff;
        }
        .camera-button.free-view circle.axis-y {
            fill: #91e800;
        }
        .camera-button.free-view circle.axis-z {
            fill: #ff5262;
        }
        button {
            width: 100%;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font: 700 13px inherit;
            color: #091019;
            background: #8bf0be;
            box-shadow: 0 8px 18px rgba(88, 229, 162, 0.18);
        }
        button:hover {
            background: #b2f7d1;
        }
        #download {
            color: #dbe6fa;
            background: #202a3d;
            box-shadow: none;
        }
        .hint {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        .code-hint {
            margin: -1px 0 8px;
        }
        @media (max-width: 800px) {
            main {
                width: min(100% - 24px, 620px);
                padding-top: 16px;
            }
            .workspace {
                grid-template-columns: 1fr;
            }
            .preview {
                min-height: 440px;
            }
            aside {
                order: -1;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <header><div class="brand">codeShowcase</div></header>
            <section class="workspace">
                <div class="preview">
                    <img id="snapshot" alt="Rendered 3D code snippet card">
                    <div
                        id="nav-gizmo"
                        role="application"
                        aria-label="Viewport navigation gizmo: drag to rotate or click an axis to snap the view"
                        title="Drag to rotate; click an axis to snap"
                    ></div>
                </div>
                <aside>
                    <div class="field">
                        <label for="title">Window title</label>
                        <input id="title" value="hello.ts" maxlength="28">
                    </div>
                    <div class="field">
                        <label>Language</label>
                        <input id="language" type="hidden" value="TypeScript">
                        <div
                            class="language-options"
                            role="group"
                            aria-label="Syntax highlighting language"
                        >
                            <button
                                class="language-button active"
                                type="button"
                                data-language="TypeScript"
                                aria-label="TypeScript"
                                aria-pressed="true"
                                title="TypeScript"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="JavaScript"
                                aria-label="JavaScript"
                                aria-pressed="false"
                                title="JavaScript"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="Python"
                                aria-label="Python"
                                aria-pressed="false"
                                title="Python"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="CSS"
                                aria-label="CSS"
                                aria-pressed="false"
                                title="CSS"
                            ></button><button
                                class="language-button"
                                type="button"
                                data-language="HTML"
                                aria-label="HTML"
                                aria-pressed="false"
                                title="HTML"
                            ></button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="theme">Theme</label
                        ><select id="theme">
                            <option value="midnight">Midnight</option>
                            <option value="monokai">Monokai</option>
                            <option value="darcula">Darcula</option>
                            <option value="solarized">Solarized</option>
                            <option value="dracula">Dracula</option>
                            <option value="nord">Nord</option>
                            <option value="contrastLight">High Contrast Light</option>
                            <option value="contrastDark">High Contrast Dark</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="font">IDE font</label
                        ><select id="font">
                            <option>Fira Code</option>
                            <option>Reddit Mono</option>
                            <option>JetBrains Mono</option>
                            <option>IBM Plex Mono</option>
                            <option>Source Code Pro</option>
                            <option>Roboto Mono</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Camera</label>
                        <div class="camera-options" role="group" aria-label="Camera angle">
                            <button
                                class="camera-button active"
                                type="button"
                                data-camera="front"
                                aria-label="Front view"
                                aria-pressed="true"
                                title="Front view"
                            >
                                <svg viewBox="0 0 24 24">
                                    <rect x="4" y="5" width="16" height="12" rx="2" />
                                    <path d="M8 20h8M12 17v3" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="studio"
                                aria-label="Studio angle"
                                aria-pressed="false"
                                title="Studio angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m3 8 9-4 9 4-9 4zM3 8v8l9 4 9-4V8M12 12v8" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="left"
                                aria-label="Left angle"
                                aria-pressed="false"
                                title="Left angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m4 8 12-4 4 3v10L8 21 4 18zM4 8l4 3v10M8 11l12-4" />
                                </svg>
                            </button>
                            <button
                                class="camera-button"
                                type="button"
                                data-camera="right"
                                aria-label="Right angle"
                                aria-pressed="false"
                                title="Right angle"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path d="m20 8-12-4-4 3v10l12 4 4-3zM20 8l-4 3v10M16 11 4 7" />
                                </svg>
                            </button>
                            <button
                                class="camera-button free-view"
                                type="button"
                                data-camera="free"
                                aria-label="Free view: drag preview to rotate"
                                aria-pressed="false"
                                title="Free view"
                            >
                                <svg viewBox="0 0 24 24">
                                    <path class="axis-x" d="m12 13 7 4" />
                                    <circle class="axis-x" cx="19" cy="17" r="2.1" />
                                    <path class="axis-y" d="M12 13V5" />
                                    <circle class="axis-y" cx="12" cy="5" r="2.1" />
                                    <path class="axis-z" d="m12 13-7 4" />
                                    <circle class="axis-z" cx="5" cy="17" r="2.1" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label class="range-label" for="pop-height"
                            ><span>3D text height</span
                            ><output id="pop-height-value">0.011</output></label
                        ><input
                            id="pop-height"
                            type="range"
                            min="0"
                            max="0.3"
                            step="0.001"
                            value="0.011"
                        >
                    </div>
                    <div class="field">
                        <label for="code">Snippet</label>
                        <p class="hint code-hint">
                            Wrap text in <code>[[double brackets]]</code> to render it as a flush 3D
                            layer.
                        </p>
                        <textarea id="code" spellcheck="false">const hello = (name: string) => {
  return `Hello, ${name}.`;
};

console.log(hello("[[world]]"));</textarea>
                    </div>
                    <button id="download">Download PNG</button>
                </aside>
            </section>
        </main>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
            }
        }
        </script>
        <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
        import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js";

        const preview = document.querySelector(".preview"),
            image = document.querySelector("#snapshot"),
            gizmo = document.querySelector("#nav-gizmo");
        const themes = {
            midnight: {
                bg: "#101624",
                body: "#172033",
                screen: "#0a0f1b",
                bar: "#121a2a",
                text: "#d8e1f1",
                muted: "#4d5a72",
                keyword: "#8bf0be",
                type: "#dba5ff",
            },
            monokai: {
                bg: "#272822",
                body: "#3d3d34",
                screen: "#272822",
                bar: "#1f201c",
                text: "#f8f8f2",
                muted: "#75715e",
                keyword: "#f92672",
                type: "#66d9ef",
            },
            darcula: {
                bg: "#252526",
                body: "#3c3f41",
                screen: "#2b2b2b",
                bar: "#323232",
                text: "#a9b7c6",
                muted: "#5c6370",
                keyword: "#cc7832",
                type: "#a9b7c6",
            },
            solarized: {
                bg: "#fdf6e3",
                body: "#eee8d5",
                screen: "#fdf6e3",
                bar: "#586e75",
                text: "#586e75",
                muted: "#93a1a1",
                keyword: "#b58900",
                type: "#2aa198",
            },
            dracula: {
                bg: "#282a36",
                body: "#44475a",
                screen: "#282a36",
                bar: "#343746",
                text: "#f8f8f2",
                muted: "#6272a4",
                keyword: "#ff79c6",
                type: "#8be9fd",
            },
            nord: {
                bg: "#2e3440",
                body: "#434c5e",
                screen: "#2e3440",
                bar: "#3b4252",
                text: "#eceff4",
                muted: "#4c566a",
                keyword: "#88c0d0",
                type: "#b48ead",
            },
            contrastLight: {
                bg: "#ffffff",
                body: "#e5e5e5",
                screen: "#ffffff",
                bar: "#202020",
                text: "#000000",
                muted: "#555555",
                keyword: "#a00000",
                type: "#005f9e",
            },
            contrastDark: {
                bg: "#000000",
                body: "#252525",
                screen: "#000000",
                bar: "#171717",
                text: "#ffffff",
                muted: "#ababab",
                keyword: "#00ff66",
                type: "#00d9ff",
            },
        };
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(themes.midnight.bg);
        const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            preserveDrawingBuffer: true,
            alpha: false,
        });
        renderer.setPixelRatio(Math.min(3, Math.max(2, devicePixelRatio || 1)));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.domElement.className = "live-canvas";
        preview.append(renderer.domElement);
        const gizmoRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        gizmoRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        gizmoRenderer.setSize(118, 118, false);
        gizmo.append(gizmoRenderer.domElement);
        const gizmoScene = new THREE.Scene(),
            gizmoCamera = new THREE.PerspectiveCamera(34, 1, 0.1, 100),
            gizmoRoot = new THREE.Group(),
            gizmoRaycaster = new THREE.Raycaster(),
            gizmoPickables = [];
        gizmoScene.add(gizmoRoot);
        const axisData = [
            { axis: "x", color: "#4a55ff", vector: new THREE.Vector3(1, 0, 0), label: "X" },
            { axis: "y", color: "#91e800", vector: new THREE.Vector3(0, 1, 0), label: "Y" },
            { axis: "z", color: "#ff3044", vector: new THREE.Vector3(0, 0, 1), label: "Z" },
        ];
        function axisLabel(label, color) {
            const canvas = document.createElement("canvas"),
                context = canvas.getContext("2d");
            canvas.width = 128;
            canvas.height = 128;
            context.fillStyle = color;
            context.beginPath();
            context.arc(64, 64, 52, 0, Math.PI * 2);
            context.fill();
            context.fillStyle = "#080d16";
            context.font = "700 64px Inter, system-ui, sans-serif";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText(label, 64, 68);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            const sprite = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }),
            );
            sprite.scale.setScalar(0.72);
            return sprite;
        }
        axisData.forEach(({ axis, color, vector, label }) => {
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(),
                    vector.clone().multiplyScalar(1.22),
                ]),
                new THREE.LineBasicMaterial({ color }),
            );
            gizmoRoot.add(line);
            const end = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 24, 16),
                new THREE.MeshBasicMaterial({ color }),
            );
            end.position.copy(vector).multiplyScalar(1.35);
            end.userData.axis = axis;
            gizmoRoot.add(end);
            gizmoPickables.push(end);
            const text = axisLabel(label, color);
            text.position.copy(vector).multiplyScalar(1.35);
            gizmoRoot.add(text);
            const rear = new THREE.Mesh(
                new THREE.SphereGeometry(0.15, 20, 12),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 }),
            );
            rear.position.copy(vector).multiplyScalar(-1.1);
            gizmoRoot.add(rear);
        });
        function renderGizmo() {
            gizmoCamera.position
                .copy(camera.position)
                .sub(controls.target)
                .normalize()
                .multiplyScalar(5.5);
            gizmoCamera.lookAt(0, 0, 0);
            gizmoRenderer.render(gizmoScene, gizmoCamera);
        }
        const controls = new OrbitControls(camera, gizmoRenderer.domElement);
        controls.enableDamping = false;
        controls.enablePan = false;
        controls.minDistance = 8;
        controls.maxDistance = 16;
        controls.target.set(0, 0.05, 0);
        controls.enabled = false;
        controls.addEventListener("change", () => {
            if (activeCamera === "free") {
                renderer.render(scene, camera);
                renderGizmo();
            }
        });
        let gizmoStart;
        gizmoRenderer.domElement.addEventListener(
            "pointerdown",
            (event) => (gizmoStart = [event.clientX, event.clientY]),
        );
        gizmoRenderer.domElement.addEventListener("pointerup", (event) => {
            if (
                !gizmoStart ||
                Math.hypot(event.clientX - gizmoStart[0], event.clientY - gizmoStart[1]) > 5
            )
                return;
            const rect = gizmoRenderer.domElement.getBoundingClientRect(),
                pointer = new THREE.Vector2(
                    ((event.clientX - rect.left) / rect.width) * 2 - 1,
                    (-(event.clientY - rect.top) / rect.height) * 2 + 1,
                );
            gizmoRaycaster.setFromCamera(pointer, gizmoCamera);
            const hit = gizmoRaycaster.intersectObjects(gizmoPickables)[0];
            if (hit) {
                const distance = camera.position.distanceTo(controls.target),
                    vector = axisData.find((item) => item.axis === hit.object.userData.axis).vector;
                camera.position.copy(controls.target).addScaledVector(vector, distance);
                camera.lookAt(controls.target);
                controls.update();
                renderer.render(scene, camera);
                renderGizmo();
            }
        });
        const group = new THREE.Group();
        scene.add(group);
        scene.add(new THREE.HemisphereLight("#b8cbff", "#1b1a29", 1.8));
        const key = new THREE.DirectionalLight("#e5eeff", 3.1);
        key.position.set(-4, 6, 6);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.left = -8;
        key.shadow.camera.right = 8;
        key.shadow.camera.top = 8;
        key.shadow.camera.bottom = -8;
        scene.add(key);
        const rim = new THREE.PointLight("#718bff", 22, 16, 2);
        rim.position.set(5, 2, 2);
        scene.add(rim);
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(40, 40),
            new THREE.ShadowMaterial({ color: "#000000", opacity: 0.38 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -3.2;
        floor.receiveShadow = true;
        scene.add(floor);
        function roundedShape(w, h, r) {
            const x = -w / 2,
                y = -h / 2,
                s = new THREE.Shape();
            s.moveTo(x + r, y);
            s.lineTo(x + w - r, y);
            s.quadraticCurveTo(x + w, y, x + w, y + r);
            s.lineTo(x + w, y + h - r);
            s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            s.lineTo(x + r, y + h);
            s.quadraticCurveTo(x, y + h, x, y + h - r);
            s.lineTo(x, y + r);
            s.quadraticCurveTo(x, y, x + r, y);
            return s;
        }
        function titlebarShape(w, h, r) {
            const x = -w / 2,
                y = -h / 2,
                s = new THREE.Shape();
            s.moveTo(x, y);
            s.lineTo(x + w, y);
            s.lineTo(x + w, y + h - r);
            s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            s.lineTo(x + r, y + h);
            s.quadraticCurveTo(x, y + h, x, y + h - r);
            s.lineTo(x, y + r);
            s.lineTo(x, y);
            return s;
        }
        function frameShape() {
            const frame = roundedShape(7.3, 4.6, 0.28),
                hole = new THREE.Path(roundedShape(7.06, 4.36, 0.2).getPoints(48).reverse());
            frame.holes.push(hole);
            return frame;
        }
        const bodyMaterial = new THREE.MeshStandardMaterial({
                color: themes.midnight.body,
                metalness: 0.38,
                roughness: 0.34,
            }),
            body = new THREE.Mesh(
                new THREE.ExtrudeGeometry(frameShape(), {
                    depth: 0.035,
                    bevelEnabled: true,
                    curveSegments: 48,
                    bevelSegments: 6,
                    bevelSize: 0.018,
                    bevelThickness: 0.018,
                }),
                bodyMaterial,
            );
        body.position.z = 0.14;
        body.castShadow = true;
        body.receiveShadow = true;
        group.add(body);
        const screenMaterial = new THREE.MeshStandardMaterial({
                color: themes.midnight.screen,
                roughness: 0.82,
                metalness: 0,
            }),
            screen = new THREE.Mesh(
                new THREE.ShapeGeometry(roundedShape(7.06, 4.36, 0.2), 48),
                screenMaterial,
            );
        screen.position.z = 0.15;
        screen.receiveShadow = true;
        group.add(screen);
        const barMaterial = new THREE.MeshStandardMaterial({
                color: themes.midnight.bar,
                roughness: 0.7,
                metalness: 0.05,
            }),
            topbar = new THREE.Mesh(
                new THREE.ShapeGeometry(titlebarShape(7.06, 0.42, 0.2), 48),
                barMaterial,
            );
        topbar.position.set(0, 1.95, 0.161);
        topbar.receiveShadow = true;
        group.add(topbar);
        const codeCanvas = document.createElement("canvas"),
            ctx = codeCanvas.getContext("2d");
        codeCanvas.width = 1400;
        codeCanvas.height = 800;
        const codeTexture = new THREE.CanvasTexture(codeCanvas);
        codeTexture.colorSpace = THREE.SRGBColorSpace;
        codeTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const codeMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(6.72, 3.42),
            new THREE.MeshBasicMaterial({ map: codeTexture, transparent: true }),
        );
        codeMesh.position.set(0.05, -0.28, 0.17);
        group.add(codeMesh);
        [
            ["#ff6259", -3.12],
            ["#ffbd44", -2.82],
            ["#00ca4e", -2.52],
        ].forEach(([color, x]) => {
            const dot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.075, 0.075, 0.04, 64, 1, false),
                new THREE.MeshStandardMaterial({
                    color,
                    roughness: 0.56,
                    metalness: 0.05,
                    flatShading: true,
                }),
            );
            dot.rotation.x = Math.PI / 2;
            dot.position.set(x, 1.95, 0.183);
            dot.castShadow = true;
            group.add(dot);
        });
        const titleTexture = new THREE.CanvasTexture(document.createElement("canvas"));
        titleTexture.image.width = 600;
        titleTexture.image.height = 80;
        const titleMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 0.33),
            new THREE.MeshBasicMaterial({ map: titleTexture, transparent: true }),
        );
        titleMesh.position.set(0.25, 1.92, 0.18);
        group.add(titleMesh);
        const popGroup = new THREE.Group();
        group.add(popGroup);
        function disposePops() {
            const textures = new Set(),
                geometries = new Set();
            while (popGroup.children.length) {
                const mesh = popGroup.children.pop();
                geometries.add(mesh.geometry);
                textures.add(mesh.material.map);
                mesh.material.dispose();
            }
            geometries.forEach((geometry) => geometry.dispose());
            textures.forEach((texture) => texture.dispose());
        }
        const syntaxTokens = {
            TypeScript: {
                keywords: [
                    "const",
                    "let",
                    "return",
                    "console",
                    "log",
                    "function",
                    "class",
                    "import",
                    "from",
                    "if",
                    "else",
                ],
                types: ["string", "number", "boolean", "true", "false"],
            },
            JavaScript: {
                keywords: [
                    "const",
                    "let",
                    "return",
                    "console",
                    "log",
                    "function",
                    "class",
                    "import",
                    "from",
                    "if",
                    "else",
                ],
                types: ["true", "false", "null", "undefined"],
            },
            Python: {
                keywords: [
                    "def",
                    "return",
                    "class",
                    "import",
                    "from",
                    "if",
                    "else",
                    "for",
                    "in",
                    "print",
                ],
                types: ["str", "int", "bool", "True", "False", "None"],
            },
            CSS: {
                keywords: [
                    "color",
                    "background",
                    "display",
                    "position",
                    "margin",
                    "padding",
                    "font",
                    "grid",
                    "flex",
                ],
                types: ["px", "rem", "vh", "vw"],
            },
            HTML: {
                keywords: [
                    "html",
                    "head",
                    "body",
                    "div",
                    "span",
                    "script",
                    "style",
                    "main",
                    "section",
                ],
                types: ["class", "id", "href", "src", "alt"],
            },
        };
        function codeColor(token, theme, language) {
            const tokens = syntaxTokens[language];
            return tokens.keywords.includes(token)
                ? theme.keyword
                : tokens.types.includes(token)
                  ? theme.type
                  : theme.text;
        }
        function addFlushText(text, px, y, color, height) {
            const width = Math.ceil(ctx.measureText(text).width) + 2,
                tile = document.createElement("canvas"),
                tileCtx = tile.getContext("2d");
            tile.width = width;
            tile.height = 57;
            tileCtx.font = ctx.font;
            tileCtx.textBaseline = "middle";
            tileCtx.fillStyle = color;
            tileCtx.fillText(text, 0, 28.5);
            const texture = new THREE.CanvasTexture(tile);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const geometry = new THREE.PlaneGeometry(
                    (tile.width / 1400) * 6.72,
                    (tile.height / 800) * 3.42,
                ),
                x = 0.05 - 3.36 + ((px + tile.width / 2) / 1400) * 6.72,
                z = 0.171,
                layers = Math.min(24, Math.max(1, Math.ceil(height / 0.008))),
                sideColor = new THREE.Color(color).multiplyScalar(0.42);
            for (let layer = 0; layer < layers; layer++) {
                const side = new THREE.Mesh(
                    geometry,
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        color: sideColor,
                        transparent: true,
                        alphaTest: 0.01,
                    }),
                );
                side.position.set(
                    x,
                    -0.28 + 1.71 - (y / 800) * 3.42,
                    z + (height * layer) / layers,
                );
                side.renderOrder = 1;
                popGroup.add(side);
            }
            const face = new THREE.Mesh(
                geometry.clone(),
                new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.01 }),
            );
            face.position.set(x, -0.28 + 1.71 - (y / 800) * 3.42, z + height);
            face.renderOrder = 2;
            popGroup.add(face);
        }
        function draw() {
            const code = document.querySelector("#code").value,
                title = document.querySelector("#title").value || "untitled",
                language = document.querySelector("#language").value,
                theme = themes[document.querySelector("#theme").value],
                fontName = document.querySelector("#font").value,
                popHeight = Number(document.querySelector("#pop-height").value),
                editorFont = `"${fontName}", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
            document.documentElement.style.setProperty("--editor-font", `"${fontName}"`);
            scene.background.set(theme.bg);
            bodyMaterial.color.set(theme.body);
            screenMaterial.color.set(theme.screen);
            barMaterial.color.set(theme.bar);
            ctx.clearRect(0, 0, 1400, 800);
            ctx.fillStyle = theme.screen;
            ctx.fillRect(0, 0, 1400, 800);
            ctx.font = `31px ${editorFont}`;
            ctx.textBaseline = "middle";
            disposePops();
            const syntaxPattern = new RegExp(
                `(${[...syntaxTokens[language].keywords, ...syntaxTokens[language].types].join("|")})`,
            );
            const lines = code.split("\n");
            lines.forEach((rawLine, i) => {
                const line = rawLine.replace(/\[\[(.*?)\]\]/g, "$1");
                let y = 76 + i * 57;
                ctx.fillStyle = theme.muted;
                ctx.fillText(String(i + 1).padStart(2, " "), 45, y);
                const chunks = line.split(syntaxPattern);
                let x = 142;
                chunks.forEach((chunk) => {
                    ctx.fillStyle = codeColor(chunk, theme, language);
                    ctx.fillText(chunk, x, y);
                    x += ctx.measureText(chunk).width;
                });
                [...rawLine.matchAll(/\[\[(.*?)\]\]/g)].forEach((match) => {
                    const before = rawLine.slice(0, match.index).replace(/\[\[(.*?)\]\]/g, "$1"),
                        px = 142 + ctx.measureText(before).width;
                    addFlushText(match[1], px, y, codeColor(match[1], theme, language), popHeight);
                });
            });
            codeTexture.needsUpdate = true;
            const t = titleTexture.image.getContext("2d");
            t.clearRect(0, 0, 600, 80);
            t.font = `35px ${editorFont}`;
            t.textAlign = "center";
            t.textBaseline = "middle";
            t.fillStyle = "#fff";
            t.fillText(title, 300, 40);
            titleTexture.needsUpdate = true;
        }
        const cameraPresets = {
            studio: [5.5, 3.5, 10.5],
            front: [0, 1.2, 11.2],
            left: [-6, 2.8, 9.4],
            right: [6, 2.8, 9.4],
        };
        let activeCamera = "front";
        function applyCamera() {
            if (activeCamera === "free") {
                controls.enabled = true;
                controls.update();
                gizmo.classList.add("active");
                renderer.domElement.classList.add("active");
                renderGizmo();
                return;
            }
            controls.enabled = false;
            gizmo.classList.remove("active");
            renderer.domElement.classList.remove("active");
            const [x, y, z] = cameraPresets[activeCamera];
            camera.position.set(x, y, z);
            camera.lookAt(0, 0.05, 0);
            controls.target.set(0, 0.05, 0);
        }
        function snapshot() {
            const w = preview.clientWidth,
                h = preview.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);
            image.src = renderer.domElement.toDataURL("image/png");
        }
        function update() {
            draw();
            applyCamera();
            snapshot();
        }
        let updateTimer;
        const scheduleUpdate = () => {
            clearTimeout(updateTimer);
            updateTimer = setTimeout(update, 180);
        };
        document
            .querySelectorAll("input, textarea, select")
            .forEach((field) => field.addEventListener("input", scheduleUpdate));
        document
            .querySelector("#pop-height")
            .addEventListener(
                "input",
                (event) =>
                    (document.querySelector("#pop-height-value").value = Number(
                        event.target.value,
                    ).toFixed(3)),
            );
        document
            .querySelector("#font")
            .addEventListener("change", () =>
                document.fonts.load(`31px "${document.querySelector("#font").value}"`).then(update),
            );
        document.querySelectorAll(".camera-button").forEach((button) =>
            button.addEventListener("click", () => {
                activeCamera = button.dataset.camera;
                document.querySelectorAll(".camera-button").forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();
            }),
        );
        document.querySelector("#download").addEventListener("click", () => {
            snapshot();
            const a = document.createElement("a");
            a.href = renderer.domElement.toDataURL("image/png");
            a.download = "code-showcase.png";
            a.click();
        });
        new ResizeObserver(snapshot).observe(preview);
        document.fonts.ready.then(update);
        update();
        document.querySelectorAll(".language-button").forEach((button) =>
            button.addEventListener("click", () => {
                document.querySelector("#language").value = button.dataset.language;
                document.querySelectorAll(".language-button").forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();
            }),
        );
        </script>
    </body>
</html>
