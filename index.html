<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        >
        <meta name="description" content="A tiny 3D code snippet showcase.">
        <title>codeFrame</title>
        <style>
        @font-face {
            font-family: "Fira Code";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.2.6/files/fira-code-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        @font-face {
            font-family: "Reddit Mono";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/reddit-mono@5.2.6/files/reddit-mono-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        @font-face {
            font-family: "JetBrains Mono";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.6/files/jetbrains-mono-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        @font-face {
            font-family: "IBM Plex Mono";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.2.6/files/ibm-plex-mono-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        @font-face {
            font-family: "Source Code Pro";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/source-code-pro@5.2.6/files/source-code-pro-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        @font-face {
            font-family: "Roboto Mono";
            src: url("https://cdn.jsdelivr.net/npm/@fontsource/roboto-mono@5.2.6/files/roboto-mono-latin-400-normal.woff")
                format("woff");
            font-weight: 400;
        }
        :root {
            color-scheme: dark;
            --ink: #e8eef9;
            --muted: #93a0b5;
            --panel: #111827;
            --line: rgba(255, 255, 255, 0.1);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font:
                14px / 1.45 Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #090d16;
            color: var(--ink);
        }
        main {
            width: min(1540px, calc(100% - 48px));
            height: 100vh;
            margin: auto;
            padding: 24px 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.03em;
        }
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 286px;
            grid-template-rows: minmax(0, 1fr);
            height: 100%;
            min-height: 0;
            gap: 18px;
        }
        .preview {
            min-height: 0;
            height: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: radial-gradient(circle at 50% 30%, #202942, #0c101b 62%);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        #snapshot,
        .live-canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #snapshot {
            visibility: hidden;
        }
        .preview.free-view #snapshot {
            visibility: hidden;
        }
        .live-canvas {
            z-index: 1;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .live-canvas.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        #nav-gizmo {
            position: absolute;
            z-index: 2;
            right: 14px;
            bottom: 14px;
            display: grid;
            width: 118px;
            height: 118px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(8, 13, 23, 0.72);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            cursor: grab;
            touch-action: none;
        }
        #nav-gizmo:active {
            cursor: grabbing;
        }
        #nav-gizmo canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #zoom-indicator {
            position: absolute;
            z-index: 2;
            left: 14px;
            bottom: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: 58px;
            padding: 6px 8px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            color: #fff;
            background: rgba(8, 13, 23, 0.72);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
            font-size: 11px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }
        #zoom-indicator svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #zoom-indicator output {
            margin-left: auto;
        }
        .preview.overlays-hidden #nav-gizmo,
        .preview.overlays-hidden #zoom-indicator {
            display: none;
        }
        aside {
            align-self: stretch;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(18, 25, 40, 0.8);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(14px);
        }
        .accordion {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            flex-direction: column;
            gap: 8px;
        }
        .accordion-section {
            display: flex;
            flex: 0 0 auto;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(8, 13, 23, 0.35);
        }
        .accordion-section.open {
            flex: 0 0 auto;
        }
        .accordion-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 39px;
            padding: 0 12px;
            border: 0;
            border-radius: 0;
            color: #fff;
            background: transparent;
            box-shadow: none;
            text-align: left;
        }
        .accordion-trigger:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.055);
        }
        .accordion-trigger svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            transition: transform 0.18s ease;
        }
        .accordion-section.open .accordion-trigger svg {
            visibility: hidden;
        }
        .accordion-panel {
            display: none;
            padding: 0 12px 12px;
        }
        .accordion-section.open .accordion-panel {
            display: block;
        }
        .accordion-panel .snippet-field {
            min-height: 0;
        }
        label {
            display: block;
            margin: 0 0 7px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .range-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 7px;
        }
        .range-label label {
            margin: 0;
        }
        .range-label output {
            font-variant-numeric: tabular-nums;
        }
        .range-value {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reset-height {
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            padding: 0;
            border: 0;
            border-radius: 5px;
            color: #dce8fb;
            background: transparent;
            box-shadow: none;
        }
        .reset-height:hover {
            color: #fff;
            background: #243149;
        }
        .reset-height svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .reset-height .restore-icon {
            fill: currentColor;
            stroke: none;
        }
        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 11px;
            background: #0d1422;
            color: var(--ink);
            font: inherit;
            outline: none;
        }
        input[type="range"] {
            padding: 0;
            accent-color: #8bf0be;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6b82ee;
            box-shadow: 0 0 0 3px rgba(92, 116, 227, 0.15);
        }
        .cycle-control {
            display: grid;
            grid-template-columns: 32px minmax(0, 1fr) 32px;
            align-items: stretch;
            gap: 6px;
        }
        .cycle-control select {
            min-width: 0;
        }
        .cycle-button {
            display: grid;
            place-items: center;
            width: 32px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .cycle-button:hover {
            color: #fff;
            background: #172238;
        }
        .cycle-button svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        textarea {
            height: 240px;
            min-height: 0;
            resize: none;
            font:
                12px / 1.55 var(--editor-font, "Fira Code"),
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;
        }
        .field {
            margin-bottom: 15px;
        }
        .snippet-field {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .camera-options,
        .lighting-options,
        .background-options,
        .language-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
        }
        .overlay-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            background: #0d1422;
        }
        .overlay-button {
            padding: 7px 9px;
            border: 0;
            border-radius: 0;
            color: #aebbd0;
            background: transparent;
            box-shadow: none;
            font-size: 10px;
            letter-spacing: 0.08em;
        }
        .overlay-button:hover {
            color: #fff;
            background: #172238;
        }
        .overlay-button.active {
            color: #091019;
            background: #8bf0be;
            box-shadow: none;
        }
        .camera-button,
        .lighting-button,
        .background-button,
        .language-button {
            display: grid;
            place-items: center;
            aspect-ratio: 1.25;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #aebbd0;
            background: #0d1422;
            box-shadow: none;
        }
        .camera-button:hover,
        .lighting-button:hover,
        .background-button:hover,
        .language-button:hover {
            color: #fff;
            background: #172238;
        }
        .camera-button.active,
        .lighting-button.active,
        .background-button.active,
        .language-button.active {
            color: #091019;
            background: #8bf0be;
            border-color: #8bf0be;
            box-shadow: 0 5px 13px rgba(88, 229, 162, 0.16);
        }
        .camera-button svg,
        .lighting-button svg,
        .background-button svg,
        .language-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .camera-button svg,
        .lighting-button svg {
            fill: currentColor;
            stroke: none;
        }
        .camera-button[data-camera="right"] path:not(.right-view-icon),
        .camera-button[data-camera="monolith"] path:not(.monolith-icon) {
            display: none;
        }
        .background-button svg {
            fill: currentColor;
            stroke: none;
        }
        .language-button svg {
            display: none;
        }
        .language-button::before {
            width: 20px;
            height: 20px;
            content: "";
            background: currentColor;
            -webkit-mask: var(--language-icon) center / contain no-repeat;
            mask: var(--language-icon) center / contain no-repeat;
        }
        .language-button[data-language="TypeScript"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/typescript.svg");
            order: 1;
        }
        .language-button[data-language="HTML"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/html5.svg");
            order: 2;
        }
        .language-button[data-language="CSS"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/css.svg");
            order: 3;
        }
        .language-button[data-language="Python"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/python.svg");
            order: 4;
        }
        .language-button[data-language="Rust"] {
            --language-icon: url("https://cdn.jsdelivr.net/npm/simple-icons@15.15.0/icons/rust.svg");
            order: 5;
        }
        .camera-button.free-view .axis-x {
            stroke: #7181ff;
        }
        .camera-button.free-view .axis-y {
            stroke: #91e800;
        }
        .camera-button.free-view .axis-z {
            stroke: #ff5262;
        }
        .camera-button.free-view circle.axis-x {
            fill: #7181ff;
        }
        .camera-button.free-view circle.axis-y {
            fill: #91e800;
        }
        .camera-button.free-view circle.axis-z {
            fill: #ff5262;
        }
        button {
            width: 100%;
            cursor: pointer;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            font: 700 13px inherit;
            color: #091019;
            background: #8bf0be;
            box-shadow: 0 8px 18px rgba(88, 229, 162, 0.18);
        }
        button:hover {
            background: #b2f7d1;
        }
        #download {
            margin-top: auto;
            border: 1px solid #8bf0be;
            color: #8bf0be;
            background: transparent;
            box-shadow: none;
        }
        #download:hover {
            color: #091019;
            background: #8bf0be;
        }
        .hint {
            margin: 13px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        .code-hint {
            margin: -1px 0 8px;
        }
        </style>
    </head>
    <body>
        <main>
            <section class="workspace">
                <div class="preview">
                    <img id="snapshot" alt="Rendered 3D code snippet card">
                    <div id="zoom-indicator" aria-live="polite">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="6.5" />
                            <path d="m16 16 4 4" />
                        </svg><output>0%</output>
                    </div>
                    <div
                        id="nav-gizmo"
                        role="application"
                        aria-label="Viewport navigation gizmo: drag to rotate or click an axis to snap the view"
                        title="Drag to rotate; click an axis to snap; scroll scene to zoom"
                    ></div>
                </div>
                <aside>
                    <div class="accordion">
                        <section class="accordion-section open">
                            <button class="accordion-trigger" type="button" aria-expanded="true">
                                IDE<svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </button>
                            <div class="accordion-panel">
                                <div class="field">
                                    <label for="title">Window title</label>
                                    <input id="title" value="hello.ts" maxlength="28">
                                </div>
                                <div class="field">
                                    <label>Language</label>
                                    <input id="language" type="hidden" value="TypeScript">
                                    <div
                                        class="language-options"
                                        role="group"
                                        aria-label="Syntax highlighting language"
                                    >
                                        <button
                                            class="language-button active"
                                            type="button"
                                            data-language="TypeScript"
                                            aria-label="TypeScript"
                                            aria-pressed="true"
                                            title="TypeScript"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <rect
                                                    x="3.5"
                                                    y="3.5"
                                                    width="17"
                                                    height="17"
                                                    rx="2"
                                                />
                                                <path
                                                    d="M7 9h10M12 9v7M15 12.5c.6.45 1.35.7 2.1.7 1 0 1.65-.42 1.65-1.08 0-.55-.37-.88-1.62-1.16-1.32-.3-1.9-.76-1.9-1.58 0-.93.82-1.54 2-1.54.78 0 1.47.24 1.98.66"
                                                />
                                            </svg>
                                        </button><button
                                            class="language-button"
                                            type="button"
                                            data-language="JavaScript"
                                            aria-label="JavaScript"
                                            aria-pressed="false"
                                            title="JavaScript"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <rect
                                                    x="3.5"
                                                    y="3.5"
                                                    width="17"
                                                    height="17"
                                                    rx="2"
                                                />
                                                <path
                                                    d="M10 8v5.3c0 1.35-.68 2.1-1.95 2.1-.7 0-1.3-.23-1.7-.65M14 14.9c.45.38 1.13.6 1.82.6 1.04 0 1.68-.45 1.68-1.14 0-.57-.38-.9-1.7-1.18-1.25-.28-1.8-.74-1.8-1.55 0-.9.75-1.48 1.87-1.48.77 0 1.42.23 1.88.65"
                                                />
                                            </svg>
                                        </button><button
                                            class="language-button"
                                            type="button"
                                            data-language="Python"
                                            aria-label="Python"
                                            aria-pressed="false"
                                            title="Python"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path
                                                    d="M12 4.5H8.8A2.8 2.8 0 0 0 6 7.3v3.2h6V12H8.2M12 19.5h3.2a2.8 2.8 0 0 0 2.8-2.8v-3.2h-6V12h3.8"
                                                />
                                                <circle
                                                    cx="9"
                                                    cy="7.6"
                                                    r=".7"
                                                    fill="currentColor"
                                                    stroke="none"
                                                />
                                                <circle
                                                    cx="15"
                                                    cy="16.4"
                                                    r=".7"
                                                    fill="currentColor"
                                                    stroke="none"
                                                />
                                            </svg>
                                        </button><button
                                            class="language-button"
                                            type="button"
                                            data-language="CSS"
                                            aria-label="CSS"
                                            aria-pressed="false"
                                            title="CSS"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path
                                                    d="m5 4 1.2 16L12 21l5.8-1L19 4zM8.5 8h7M9 12h6M9.5 16h5"
                                                />
                                            </svg>
                                        </button><button
                                            class="language-button"
                                            type="button"
                                            data-language="HTML"
                                            aria-label="HTML"
                                            aria-pressed="false"
                                            title="HTML"
                                        >
                                            <svg viewBox="0 0 24 24">
                                                <path
                                                    d="m4 12 5-5M4 12l5 5M20 12l-5-5M20 12l-5 5M13.5 5.5l-3 13"
                                                />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="theme">Theme</label>
                                    <div class="cycle-control">
                                        <button
                                            class="cycle-button"
                                            type="button"
                                            data-cycle-target="theme"
                                            data-cycle-step="-1"
                                            aria-label="Previous theme"
                                        >
                                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                                <path d="m15 18-6-6 6-6" />
                                            </svg>
                                        </button><select id="theme">
                                            <option value="midnight">Midnight</option>
                                            <option value="monokai">Monokai</option>
                                            <option value="darcula">Darcula</option>
                                            <option value="solarized">Solarized</option>
                                            <option value="dracula">Dracula</option>
                                            <option value="nord">Nord</option>
                                            <option value="contrastLight">
                                                High Contrast Light
                                            </option>
                                            <option value="contrastDark">High Contrast Dark</option>
                                        </select><button
                                            class="cycle-button"
                                            type="button"
                                            data-cycle-target="theme"
                                            data-cycle-step="1"
                                            aria-label="Next theme"
                                        >
                                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                                <path d="m9 18 6-6-6-6" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="field">
                                    <label for="font">IDE font</label>
                                    <div class="cycle-control">
                                        <button
                                            class="cycle-button"
                                            type="button"
                                            data-cycle-target="font"
                                            data-cycle-step="-1"
                                            aria-label="Previous IDE font"
                                        >
                                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                                <path d="m15 18-6-6 6-6" />
                                            </svg>
                                        </button><select id="font">
                                            <option>Fira Code</option>
                                            <option>Reddit Mono</option>
                                            <option>JetBrains Mono</option>
                                            <option>IBM Plex Mono</option>
                                            <option>Source Code Pro</option>
                                            <option>Roboto Mono</option>
                                        </select><button
                                            class="cycle-button"
                                            type="button"
                                            data-cycle-target="font"
                                            data-cycle-step="1"
                                            aria-label="Next IDE font"
                                        >
                                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                                <path d="m9 18 6-6-6-6" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="field">
                                    <div class="range-label">
                                        <label for="font-size">IDE font size</label
                                        ><span class="range-value"

                curveSegments: 48,

            codeMesh.geometry = new THREE.PlaneGeometry(width, contentHeight);
            codeMesh.position.y = -titlebarHeight / 2;
            topbar.position.y = innerHeight / 2 - titlebarHeight / 2;
            const lightRadius = titlebarHeight * 0.14,
                lightDepth = lightRadius * 0.53,
                barDepth = lightDepth * 0.5,

            topbar.position.z = codeMesh.position.z + 0.004;

                dot.geometry.dispose();
                dot.geometry = new THREE.CylinderGeometry(

                    lightRadius,
                    lightDepth,

        const popGroup = new THREE.Group();
        group.add(popGroup);
        function disposePops() {
            const geometries = new Set(),
                materials = new Set(),
                meshes = [...popGroup.children];
            popGroup.clear();
            meshes.forEach((mesh) => {
                geometries.add(mesh.geometry);
                (Array.isArray(mesh.material) ? mesh.material : [mesh.material]).forEach(
                    (material) => materials.add(material),
                );
            });
            geometries.forEach((geometry) => geometry.dispose());
            materials.forEach((material) => material.dispose());
        }
        const outlineFonts = new Map(),
            outlineSources = {
                "Fira Code":
                    "https://cdn.jsdelivr.net/npm/@fontsource/fira-code@5.2.6/files/fira-code-latin-400-normal.woff",
                "Reddit Mono":
                    "https://cdn.jsdelivr.net/npm/@fontsource/reddit-mono@5.2.6/files/reddit-mono-latin-400-normal.woff",
                "JetBrains Mono":
                    "https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.6/files/jetbrains-mono-latin-400-normal.woff",
                "IBM Plex Mono":
                    "https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.2.6/files/ibm-plex-mono-latin-400-normal.woff",
                "Source Code Pro":
                    "https://cdn.jsdelivr.net/npm/@fontsource/source-code-pro@5.2.6/files/source-code-pro-latin-400-normal.woff",
                "Roboto Mono":
                    "https://cdn.jsdelivr.net/npm/@fontsource/roboto-mono@5.2.6/files/roboto-mono-latin-400-normal.woff",
            };
        async function loadOutlineFont(name) {
            if (outlineFonts.has(name)) return outlineFonts.get(name);
            try {
                const response = await fetch(outlineSources[name]);
                const font = opentype.parse(await response.arrayBuffer());
                outlineFonts.set(name, font);
                return font;
            } catch {
                return null;
            }

        function outlineData(font, text, size) {

                else if (command.type === "L") shapePath.lineTo(command.x, -command.y);
                else if (command.type === "C")
                    shapePath.bezierCurveTo(
                        command.x1,
                        -command.y1,
                        command.x2,
                        -command.y2,
                        command.x,
                        -command.y,
                    );

        const languageNames = {

            HTML: "xml",
            CSS: "css",
            Python: "python",
            Rust: "rust",
        };
        function highlightedSegments(code, language) {
            const template = document.createElement("template");
            template.innerHTML = globalThis.hljs.highlight(code, {
                language: languageNames[language],
                ignoreIllegals: true,
            }).value;
            const segments = [];
            function walk(node, kind = "plain") {
                node.childNodes.forEach((child) => {
                    if (child.nodeType === Node.TEXT_NODE)
                        segments.push({ text: child.textContent, kind });
                    else {
                        const token =
                            [...child.classList]
                                .find((name) => name.startsWith("hljs-"))
                                ?.replace("hljs-", "") || kind;
                        walk(child, token);
                    }
                });

            walk(template.content);

                ...segment,
                start: offset,
                end: (offset += segment.text.length),

        function syntaxColor(kind, theme) {

            if (/attr|property/.test(kind)) return theme.property || theme.type;
            if (/string|symbol/.test(kind)) return theme.string || theme.type;

            if (/keyword|literal|built_in|type|meta/.test(kind)) return theme.keyword;

        function addExtrudedText(text, px, y, color, height, font, fontSize, glyphMetrics) {
            const { shapes, bounds } = outlineData(font, text, fontSize),
                geometry = new THREE.ExtrudeGeometry(shapes, {
                    depth: height,
                    bevelEnabled: false,
                    curveSegments: 12,
                }),
                canvasWidth = codeCanvas.width / codeTextureScale,
                canvasHeight = codeCanvas.height / codeTextureScale,
                pixelsToWorldX = contentWidth / canvasWidth,
                pixelsToWorldY = contentHeight / canvasHeight,
                outlineWidth = Math.max(font.getAdvanceWidth(text, fontSize), Number.EPSILON),

            mesh.receiveShadow = true;

        }
        function draw() {
            const code = document.querySelector("#code").value,
                title = document.querySelector("#title").value || "untitled",
                language = document.querySelector("#language").value,
                theme = themes[document.querySelector("#theme").value],
                fontName = document.querySelector("#font").value,
                fontSize = Number(document.querySelector("#font-size").value),
                popHeight = Number(document.querySelector("#pop-height").value),
                outlineFont = outlineFonts.get(fontName),

            screenMaterial.color.set(theme.screen);
            barMaterial.color.set(theme.bar);

                lineBaseline = Math.ceil(fontSize * 2.8),
                leftShift = Math.ceil(fontSize * 0.24),

                logicalHeight * worldUnitsPerPixel,
                fontSize * worldUnitsPerPixel * 2.7,
            );

                canvasHeight = Math.round(contentHeight / worldUnitsPerPixel);
            const textureWidth = canvasWidth * codeTextureScale,
                textureHeight = canvasHeight * codeTextureScale,
                textureResized =

            if (textureResized) {
                codeCanvas.width = textureWidth;
                codeCanvas.height = textureHeight;

            ctx.setTransform(1, 0, 0, 1, 0, 0);

                        outlineFont,
                        fontSize,
                        glyphMetrics,

            t.clearRect(0, 0, 600, 80);
            t.font = `${Math.round(fontSize * 1.13)}px ${editorFont}`;
            t.textAlign = "center";
            t.textBaseline = "middle";
            t.fillStyle = "#fff";
            t.fillText(title, 300, 40);
            titleTexture.needsUpdate = true;
        }
        const cameraPresets = {
            studio: [5.5, 3.5, 10.5],
            front: [0, 1.2, 11.2],
            left: [-6, 2.8, 9.4],
            right: [6, 2.8, 9.4],
            monolith: [0, -4.6, 8.8],
        };
        let activeCamera = "front",
            cameraPresetRequested = true;
        const lightingModes = {
            studio: {
                sky: "#b8cbff",
                ground: "#1b1a29",
                ambient: 1.8,
                key: "#e5eeff",
                keyIntensity: 3.1,
                keyPosition: [-4, 6, 6],
                rim: "#718bff",
                rimIntensity: 22,
            },
            soft: {
                sky: "#fff5e6",
                ground: "#25283a",
                ambient: 2.5,
                key: "#fff0d5",
                keyIntensity: 2,
                keyPosition: [-3, 5, 7],
                rim: "#b5c8ff",
                rimIntensity: 10,
            },
            sunset: {
                sky: "#ffb46e",
                ground: "#28152e",
                ambient: 1.45,
                key: "#ff875f",
                keyIntensity: 3.5,
                keyPosition: [-5, 3, 6],
                rim: "#9966ff",
                rimIntensity: 28,
            },
            noir: {
                sky: "#bac7da",
                ground: "#07090e",
                ambient: 0.45,
                key: "#f0f5ff",
                keyIntensity: 4.5,
                keyPosition: [-5, 5, 4],
                rim: "#536a94",
                rimIntensity: 4,
            },
            neon: {
                sky: "#2d164f",
                ground: "#090515",
                ambient: 1.1,
                key: "#00e5ff",
                keyIntensity: 3,
                keyPosition: [-4, 4, 5],
                rim: "#ff30d7",
                rimIntensity: 38,
            },
        };
        let activeLighting = "studio";
        const backgroundModes = {
            studio: "#0c1220",
            drafting: "#dfe8e8",
            aurora: "#17102b",
            cyberdeck: "#080d16",
            gallery: "#eef2f2",
        };
        let activeBackground = "studio";
        function applyLighting() {
            const mode = lightingModes[activeLighting];
            ambient.color.set(mode.sky);
            ambient.groundColor.set(mode.ground);
            ambient.intensity = mode.ambient;
            key.color.set(mode.key);
            key.intensity = mode.keyIntensity;
            key.position.set(...mode.keyPosition);

        function applyBackground() {

        document
            .querySelectorAll("input, textarea, select")
            .forEach((field) => field.addEventListener("input", scheduleUpdate));
        document
            .querySelector("#pop-height")
            .addEventListener(
                "input",
                (event) =>

                        event.target.value,
                    ).toFixed(3)),
            );

            height.value = ".040";
            document.querySelector("#pop-height-value").value = "0.040";
            scheduleUpdate();
        });

            .querySelector("#font-size")
            .addEventListener(
                "input",
                (event) =>
                    (document.querySelector("#font-size-value").value = `${event.target.value} px`),
            );

                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();

                document.querySelectorAll(".background-button").forEach((item) => {

                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);

        document.querySelectorAll(".language-button").forEach((button) =>
            button.addEventListener("click", () => {
                document.querySelector("#language").value = button.dataset.language;
                document.querySelectorAll(".language-button").forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
                scheduleUpdate();
            }),
        );

            button.addEventListener("click", () => {
                const visible = button.dataset.overlays === "show";
                preview.classList.toggle("overlays-hidden", !visible);
                document.querySelectorAll(".overlay-button").forEach((item) => {
                    const isActive = item === button;
                    item.classList.toggle("active", isActive);
                    item.setAttribute("aria-pressed", isActive);
                });
            }),

        </script>
